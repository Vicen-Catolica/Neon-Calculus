name: CI

on:
  push:
    branches:
      - master
      - develop

  pull_request:
    branches:
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Godot Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-prereleases: false

      - name: Check Godot version
        run: godot --version

      - name: Import project
        run: |
          godot --headless --editor --quit

      - name: Validate project
        run: |
          godot --headless --editor --quit --path .

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-prereleases: false

      - name: Run tests
        run: |
          echo "No automated tests configured yet."
          echo "Tests will be added when the test suite is implemented."
