name: CI

on:
  push:
    branches:
      - master
      - develop
      - "feature/**"

  pull_request:
    branches:
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build e testes (Godot .NET)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Godot 4.7.2 .NET
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: false

      - name: Versão do Godot
        run: godot --version

      # Mesmo roteiro da máquina local: import, build C#, NUnit e as simulações
      # headless (Fase 1, rota da Fase 1, fluxo entre andares, Fase 2).
      - name: Testes
        run: tools/run_tests.sh
        env:
          SIM_TIMEOUT: "420"
